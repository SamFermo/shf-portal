<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SHF Portal">
<meta name="robots" content="noindex">
<title>SHF Portal · v2 test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: iPad-first staff app; one fixed header, a view area below. Fresh Talk palette (single warm look by design). */
:root{
  color-scheme: light;
  --bg:#f4ede0; --bg2:#ece2cc; --card:#fbf6ea; --edge:#d8c8a8; --edge2:#e6d8b8;
  --ink:#2a2418; --soft:#6a5e48; --mute:#8a7d62;
  --green:#4a6a3a; --green-d:#2e4624; --green-s:#c8d6b8;
  --rust:#b04a1a; --rust-d:#7a3410; --rust-s:#fae0c8;
  --gold:#a8842c; --gold-d:#8a6a1c; --gold-s:#f0e4c4;
  --wood:#5a3a22; --wood2:#8a6a4a; --blue:#3a6ea5; --blue-s:#e3ecf6; --blue-d:#24507e;
  --serif:"Caladea",Georgia,serif; --sans:"Inter",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.demo{background:var(--wood);color:var(--gold-s);font-size:12px;letter-spacing:.06em;text-align:center;padding:5px max(16px,env(safe-area-inset-left,0px)) 5px max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.demo button{background:transparent;border:1px solid var(--gold);color:var(--gold-s);border-radius:999px;padding:2px 10px;font-size:12px}
header.top{background:var(--card);border-bottom:1px solid var(--edge);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--card);flex:0 0 auto}
.who small{display:block;color:var(--soft);font-size:12px}
.mid{text-align:center}
.eyebrow{font-family:var(--serif);font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--wood2)}
.mid h1{margin:0;font-family:var(--serif);font-size:22px;line-height:1.2}
.sub{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--soft)}
.sub b{font-style:normal;color:var(--ink)} .sub b.g{color:var(--green-d)}
.right{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--gold);background:transparent;border-radius:8px;min-height:44px;padding:0 14px;color:var(--wood);font-family:var(--serif);font-size:15px}
.btn.solid{background:var(--green);border-color:var(--green);color:var(--card);font-family:var(--sans);font-weight:600}
.btn.wood{background:var(--wood);border-color:var(--wood);color:var(--card);font-family:var(--sans);font-weight:600}
.btn.ghost{border-color:var(--edge)}
.btn.danger{border-color:var(--rust);color:var(--rust-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.datesw{display:flex;gap:6px;align-items:center;justify-content:center;margin:4px 0 2px}
.round{width:32px;height:32px;border-radius:16px;border:1px solid var(--gold);background:transparent;color:var(--wood);display:inline-flex;align-items:center;justify-content:center}
.pillsel{font-family:var(--serif);font-style:italic;font-size:13px;border:1px solid var(--gold);border-radius:999px;padding:4px 14px;background:transparent}
nav.tabs{display:flex;justify-content:center;padding:10px 16px 4px}
nav.tabs .wrap{display:flex;flex-wrap:wrap;gap:2px;background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:4px;box-shadow:0 2px 6px rgba(58,42,22,.12);justify-content:center}
nav.tabs button{font-family:var(--serif);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--wood);padding:8px 14px;border-radius:999px;border:1px solid transparent;background:transparent;min-height:36px}
nav.tabs button.on{background:var(--green-s);border-color:var(--green);color:var(--green-d)}
main{padding:10px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;box-shadow:0 2px 8px rgba(58,42,22,.1)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid transparent;white-space:nowrap}
.pill.al{background:var(--rust-s);color:var(--rust-d);border-color:var(--rust)}
.pill.rt{background:var(--gold-s);color:var(--wood);border-color:var(--gold)}
.pill.grp{background:var(--blue-s);color:var(--blue-d);border-color:var(--blue)}
.pill.ok{background:var(--green-s);color:var(--green-d);border-color:var(--green)}
.pill.cx{background:var(--bg2);font-weight:600;font-variant-numeric:tabular-nums}
.pill.mute{background:var(--bg2);color:var(--soft)}
.nm{font-family:var(--serif);font-size:19px;font-weight:700}
.muted{color:var(--soft);font-size:13px}
.kl{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--gold-d)}
.row2{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.grow{flex:1 1 420px;min-width:0}
.side{flex:0 1 400px;min-width:0;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--wood);color:var(--card);padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:60;max-width:calc(100% - 32px)}
.modalbg{position:fixed;inset:0;background:rgba(42,36,24,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:14px;border:1px solid var(--edge);max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h2{margin:0 0 6px;font-family:var(--serif);font-size:22px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft)}
input.t,select.t,textarea.t{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--edge);border-radius:8px;min-height:44px;padding:8px 12px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:700px){header.top{grid-template-columns:1fr;text-align:center}.who,.right{justify-content:center}.grid2{grid-template-columns:1fr}}
/* sign in */
.signin{min-height:calc(100vh - 30px);display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(rgba(244,237,224,.6),rgba(244,237,224,.6)),radial-gradient(circle at 30% 20%,#d9c9a2,#b9a47a 60%,#8a7650)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.keys button{font-family:var(--serif);font-size:26px;color:var(--wood);background:var(--card);border:1px solid var(--edge);border-radius:12px;height:64px}
.dots{display:flex;gap:14px}.dots span{width:16px;height:16px;border-radius:8px;border:2px solid var(--gold)}.dots span.f{background:var(--wood);border-color:var(--wood)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.people button{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;min-height:64px}
/* ring */
.ringwrap{position:relative;height:640px;max-width:900px;margin:0 auto}
.tile{position:absolute;width:132px;height:132px;background:var(--card);border:1px solid var(--edge);border-radius:10px;box-shadow:0 2px 8px rgba(58,42,22,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:8px}
.tile .ic{font-size:22px;color:var(--green);line-height:1}
.tile .lb{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--wood);line-height:1.15}
.tile .st{font-size:12px;color:var(--soft);line-height:1.3}
.tile.office{border:2px solid var(--gold);background:var(--gold-s)}
.tile.warn{border-color:var(--rust)} .tile.warn .st{color:var(--rust-d)}
.hub{position:absolute;width:184px;height:184px;border-radius:92px;background:radial-gradient(circle at 50% 40%,var(--card),var(--gold-s));border:2px solid var(--gold);box-shadow:0 4px 14px rgba(58,42,22,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
@media (max-width:900px){.ringwrap{height:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.tile,.hub{position:static;width:auto;height:132px}.hub{border-radius:14px;grid-column:1/-1;height:120px}}
/* check-in */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--edge)}
.seg button{background:transparent;border:0;border-bottom:3px solid transparent;padding:12px;min-height:48px;color:var(--soft)}
.seg button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--green)}
.party{width:100%;text-align:left;background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.party.sel{background:#fff0c8;border:2px solid #c8a040}
.party.in{opacity:.75}
.guestrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--edge2)}
.guestrow:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:22px;border:1px solid var(--gold);background:var(--card);font-size:20px;color:var(--wood)}
.note{border-left:3px solid var(--rust);background:var(--rust-s);border-radius:6px;padding:10px 12px;font-size:14px}
/* seating */
.board{border:1px solid #b9a888;border-radius:14px;background:radial-gradient(circle at 50% 45%,#eadfc8,#d8c8a8);padding:16px;overflow-x:auto}
.tables{display:flex;gap:34px;justify-content:center;align-items:center;min-width:760px;padding:12px 0}
.tbl{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.srow{display:flex;gap:6px}
.seat{width:52px;height:48px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;border:1px solid transparent;background:repeating-linear-gradient(135deg,#6b4a2e 0 3px,#5a3a22 3px 7px);color:#d8c8a8;padding:0}
.seat b{font-size:12px}
.seat.taken{background:var(--card);border-color:var(--green);color:var(--green-d)}
.seat.alg{background:var(--rust-s);border:2px solid var(--rust);color:var(--rust-d)}
.seat.mine{outline:3px dashed #c8a040;outline-offset:1px}
.seat.cap{opacity:.35}
.slab{height:54px;border-radius:3px;background:linear-gradient(#6b4a2e,#3e2716);box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;font-weight:700;color:var(--card)}
/* office */
.otabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--edge);margin-bottom:12px}
.otabs button{font-family:var(--serif);font-size:15px;padding:10px 14px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--wood);min-height:44px}
.otabs button.on{border-bottom-color:var(--gold);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:12px 14px}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table.season{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.season th{font-size:11px;letter-spacing:.1em;color:var(--soft);text-align:left;padding:10px 12px;background:var(--bg)}
table.season td{padding:10px 12px;border-top:1px solid var(--edge2);vertical-align:middle}
.sq{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:3px;vertical-align:middle}
.status{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.alist{display:flex;flex-direction:column;gap:8px}
.aitem{border-left:3px solid var(--gold);padding:6px 10px;font-size:14px;line-height:1.45;background:var(--card);border-radius:0 6px 6px 0}
.mail{background:#fff;border:1px solid var(--edge);border-radius:10px;padding:14px;font-size:14px;line-height:1.5}
.mail .hd{font-size:12px;color:var(--soft);border-bottom:1px solid var(--edge2);padding-bottom:8px;margin-bottom:8px}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.party,.tile,.seat{transition:background-color .15s,border-color .15s}}
</style>

</head>
<body>
<div class="demo" role="note"><span>DEMO · sample data only · not connected to anything · only bug reports leave this browser</span><button type="button" id="bugBtn" style="background:var(--gold);color:var(--wood);border-color:var(--gold);font-weight:600">Report a bug</button><button type="button" id="resetBtn">Reset demo</button><a href="v1/" style="color:var(--gold-s);font-size:12px">Current portal</a></div>
<div id="app"></div>

<script>
'use strict';
// ---------------------------------------------------------------------------------------------
// Swan House Farm staff app v2: DEMO. All data below is invented. State lives in this browser
// only (localStorage), so a test run can be reset at any time. No network, no Firebase, no email.
// ---------------------------------------------------------------------------------------------
const STORE = 'shf-staff-demo-v1';
const PEOPLE = [
  { id: 'sam', name: 'Sam West', email: 'sam@sanfermoseattle.com', role: 'owner', color: '#5a3a22', pin: '1234' },
  { id: 'tim', name: 'Tim', email: 'tim@sanfermoseattle.com', role: 'owner', color: '#8a6a1c', pin: '1234' },
  { id: 'kelly', name: 'Kelly', email: 'kelly@example.com', role: 'owner', color: '#7a3410', pin: '1234' },
  { id: 'arlen', name: 'Arlen', email: 'arlen@example.com', role: 'host', color: '#4a6a3a', pin: '1234' },
  { id: 'jess', name: 'Jessica V.', email: 'jessica@example.com', role: 'host', color: '#3a6ea5', pin: '1234' },
];
const MENU = [
  { n: 1, name: 'Garden crudo, whipped ricotta', contains: ['dairy'] },
  { n: 2, name: 'Steamer clams, squid ink campanelle', contains: ['shellfish', 'squid', 'gluten'], swap: 'Plain campanelle with chanterelles (set aside, no ink)' },
  { n: 3, name: 'Charred leeks, romesco', contains: ['tree nuts'], swap: 'Leeks with salsa verde' },
  { n: 4, name: 'Porchetta, farm beans', contains: ['pork'], swap: 'Roast chicken thigh' },
  { n: 5, name: 'Farm greens', contains: [] },
  { n: 6, name: 'Olive oil cake, peaches', contains: ['gluten', 'dairy', 'peach'], swap: 'Peach granita' },
];
const TABLES = [
  { id: 'A', top: [5, 6, 7, 8], bottom: [4, 3, 2, 1], cap: 9, capLabel: 'fence end' },
  { id: 'B', top: [6, 7, 8, 9, 10], bottom: [5, 4, 3, 2, 1] },
  { id: 'C', top: [5, 6, 7, 8], bottom: [4, 3, 2, 1], cap: 9, capLabel: 'driveway end' },
];

function sampleData() {
  const p = (id, name, tickets, guests, extra = {}) => ({ id, name, tickets, guests, arrived: 0, checkedIn: false, note: '', status: 'confirmed', payment: 'paid', source: 'online', ...extra });
  const g = (name, allergies = []) => ({ name, allergies });
  return {
    salesOpen: true,
    dinners: [
      { id: '2027-05-15', label: 'Saturday, May 15', short: 'Sat, May 15', series: 'May series', status: 'soldout', capacity: 13, waitlist: [{ name: 'Moreau', tickets: 1 }, { name: 'Chen', tickets: 2 }, { name: 'Ibarra', tickets: 1 }],
        parties: [
          p('b1', 'Pat Garcia', 2, [g('Pat Garcia', ['shellfish']), g('Sam Garcia'), g('Jordan Lee', ['tree nuts', 'squid']), g('')], { returning: '2024 ×2', note: "Celebrating Sam's 40th" }),
          p('b2', 'Erik Lindqvist', 2, [g('Erik Lindqvist', ['gluten']), g('Anna Lindqvist', ['gluten']), g('Ole Berg'), g('Mia Berg'), g('Sven Lindqvist')], { group: 'Lindqvist/Okafor', source: 'manual', oversold: 1, payment: 'paidOffline', sourceNote: 'seat added by Tim' }),
          p('b3', 'Dana Okafor', 1, [g('Dana Okafor'), g('Chris Okafor', ['pork'])], { group: 'Lindqvist/Okafor', source: 'gift', payment: 'gift' }),
          p('b4', 'Kate Brennan', 1, [g('Kate Brennan'), g('Liam Brennan')], { source: 'comp', payment: 'comp', sourceNote: 'comp (Kelly)' }),
          p('b5', 'Marcus Webb', 2, [g('Marcus Webb'), g('Tara Webb', ['dairy']), g('Noah Fisk'), g('Ivy Fisk')], { returning: '2025' }),
          p('b6', 'Rosa Alvarez', 1, [g('Rosa Alvarez', ['peach']), g('Tom Reyes')]),
          p('b7', 'Hannah Cole', 2, [g('Hannah Cole'), g('Ben Cole'), g('Ada Park', ['shellfish']), g('Jun Park')]),
          p('b8', 'Will Tanaka', 2, [g('Will Tanaka'), g('Ema Tanaka'), g(''), g('')], { returning: '2023, 2025' }),
        ] },
      { id: '2027-05-16', label: 'Sunday, May 16', short: 'Sun, May 16', series: 'May series', status: 'onsale', capacity: 13, waitlist: [],
        parties: [
          p('c1', 'Lena Novak', 2, [g('Lena Novak'), g('Max Novak'), g('Eve Hart', ['gluten']), g('Ray Hart')]),
          p('c2', 'Owen Price', 3, [g('Owen Price'), g('Jo Price'), g('Kit Moss'), g('Al Moss'), g('Sue Day'), g('Bo Day', ['tree nuts'])]),
          p('c3', 'Nina Ford', 2, [g('Nina Ford'), g('Sal Ford'), g(''), g('')]),
          p('c4', 'Ike Ross', 2, [g('Ike Ross', ['pork']), g('Meg Ross'), g('Tess Lu'), g('Dev Lu')]),
        ] },
      { id: '2027-09-11', label: 'Saturday, September 11', short: 'Sat, Sep 11', series: 'September series', status: 'scheduled', onSale: 'Fri, Apr 2, 10:00 am', capacity: 13, waitlist: [], parties: [] },
      { id: '2027-09-12', label: 'Sunday, September 12', short: 'Sun, Sep 12', series: 'September series', status: 'draft', capacity: 13, waitlist: [], parties: [] },
    ],
    seating: {},       // dinnerId -> { 'A5': partyId, ... }
    caps: {},          // dinnerId -> { A: bool, C: bool }
    harvest: { '2027-05-15': [['Chanterelles (Swan House woods)', true], ['Romanesco', true], ['Sugar snap peas', true], ['Fennel', false], ['Rainbow chard', true], ['Nasturtiums', false], ['Lemon thyme', true], ['Peaches (Stutzman)', false]] },
    setup: { '2027-05-15': [['Long tables A, B, C leveled', true], ['Linens and runners', true], ['String lights on', false], ['Water carafes filled', true], ['Bar stocked', true], ['Restroom checked', false], ['Fire extinguisher by grill', true]] },
    service: { '2027-05-15': 0 },
    gifts: [{ code: 'GDQ7MPXA3K', tickets: 2, to: 'Dana Okafor', state: 'redeemed' }, { code: 'HTRX29WNCE', tickets: 1, to: 'Lou Ames', state: 'issued' }],
    audit: [{ at: 'Nov 8, 4:12 pm', who: 'Tim', what: 'Add a booking: Erik Lindqvist, 2 ticket(s) + 1 seat over capacity on purpose' }],
    alerts: [{ kind: 'warn', text: 'May 15: one seat over 13 (Lindqvist, added by Tim). Fine as planned?' }, { kind: 'info', text: 'Matched with Gravity last night: all clear.' }],
  };
}

// ---------------- state ----------------
let S = load();
let ui = { screen: 'signin', person: null, pinEntry: '', newDevice: false, trusted: ['sam', 'tim', 'kelly', 'arlen'], dinner: 0, view: 'home',
  ciTab: 'arriving', ciFilter: '', sel: null, seatSel: null, otab: 'season', tries: {} };
function load() { try { const s = localStorage.getItem(STORE); if (s) return JSON.parse(s); } catch (e) {} return sampleData(); }
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
const me = () => PEOPLE.find(p => p.id === ui.person);
const isOwner = () => me() && me().role === 'owner';
const D = () => S.dinners[ui.dinner];
const covers = (d) => d.parties.filter(p => p.status === 'confirmed').reduce((s, p) => s + p.guests.length, 0);
const tickets = (d) => d.parties.filter(p => p.status === 'confirmed').reduce((s, p) => s + p.tickets, 0);
const left = (d) => Math.max(0, d.capacity - tickets(d));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const alls = (p) => p.guests.flatMap(g => g.allergies);
function conflicts(p) {
  const out = [];
  p.guests.forEach(g => g.allergies.forEach(a => MENU.forEach(c => { if (c.contains.includes(a)) out.push({ guest: g.name || 'Guest', allergy: a, course: c }); })));
  return out;

      <div style="border-top:1px solid var(--edge2);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:14px">
        ${TABLES.filter(t => t.cap).map(t => `<label style="display:flex;gap:8px;align-items:center;min-height:32px"><input type="checkbox" data-cap="${t.id}" ${caps[t.id] ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--green)"> ${t.id} · seat ${t.cap} (${t.capLabel})</label>`).join('')}

      <div class="tables">${TABLES.map(t => `<div class="tbl">
        <div class="srow">${t.top.map(n => seatHTML(t, n)).join('')}${t.cap && t.id === 'C' ? seatHTML(t, t.cap) : ''}</div>
        <div style="display:flex;gap:6px;align-items:center">${t.cap && t.id === 'A' ? seatHTML(t, t.cap) : ''}<div class="slab" style="flex:1">${t.id}</div></div>
        <div class="srow">${t.bottom.map(n => seatHTML(t, n)).join('')}</div></div>`).join('')}</div>
      <div style="display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--wood);flex-wrap:wrap;min-width:760px">

        <span><span class="sq" style="background:var(--rust-s);border:2px solid var(--rust)"></span>Allergy at this seat</span>

const initials = (n) => n.split(/\s+/).filter(Boolean).map(s => s[0]).join('').slice(0, 2).toUpperCase();
const seatSort = (a, b) => a[0] === b[0] ? Number(a.slice(1)) - Number(b.slice(1)) : a.localeCompare(b);
function tableSeats(t) { const caps = S.caps[D().id] || {}; return [...t.bottom.slice().reverse(), ...t.top, ...(t.cap && caps[t.id] ? [t.cap] : [])].sort((a, b) => a - b); }
function placeParty(pid, startSeat) {
  const d = D(); const m = (S.seating[d.id] = S.seating[d.id] || {});
  const p = d.parties.find(x => x.id === pid); if (!p) return;
  Object.keys(m).forEach(k => { if (m[k] === pid) delete m[k]; });
  const t = TABLES.find(x => x.id === startSeat[0]); const order = tableSeats(t); const start = Number(startSeat.slice(1));
  const free = order.filter(n => !m[t.id + n]);
  const from = free.filter(n => n >= start).concat(free.filter(n => n < start).reverse());
  if (from.length < p.guests.length) { toast(`Table ${t.id} has only ${from.length} free seats for ${p.guests.length} guests.`); return; }
  from.slice(0, p.guests.length).forEach(n => { m[t.id + n] = pid; });
  ui.seatSel = null; save(); toast(`${p.name} seated at ${t.id}`);
}
function suggest() {
  const d = D(); S.seating[d.id] = {};
  const parties = d.parties.filter(p => p.status === 'confirmed').slice().sort((a, b) => (b.group ? 1 : 0) - (a.group ? 1 : 0) || b.guests.length - a.guests.length);
  const free = {}; TABLES.forEach(t => free[t.id] = tableSeats(t).length);
  const done = new Set();
  for (const p of parties) {
    if (done.has(p.id)) continue;
    const grp = p.group ? parties.filter(x => x.group === p.group) : [p];
    const need = grp.reduce((s, x) => s + x.guests.length, 0);
    const t = TABLES.find(x => free[x.id] >= need) || TABLES.find(x => free[x.id] >= p.guests.length);
    if (!t) continue;
    for (const x of (free[t.id] >= need ? grp : [p])) {
      const order = tableSeats(t).filter(n => !S.seating[d.id][t.id + n]);
      order.slice(0, x.guests.length).forEach(n => S.seating[d.id][t.id + n] = x.id);
      free[t.id] -= x.guests.length; done.add(x.id);
    }
  }
  const missed = parties.filter(p => !done.has(p.id)).length;
  save(); toast(missed ? `${missed} part${missed > 1 ? 'ies' : 'y'} did not fit: open an end seat` : 'Suggested a seating. Adjust by tapping.');
}

function runAction(type, id, v) {
  const d = D(), p = id && d.parties.find(x => x.id === id);

    case 'booking': { const n = +v.fTix, over = Math.max(0, n - left(d)); const gs = Array.from({ length: n * 2 }, (_, i) => ({ name: i ? '' : v.fName.trim(), allergies: [] }));
      d.parties.push({ id: 'm' + Date.now(), name: v.fName.trim(), tickets: n, guests: gs, arrived: 0, checkedIn: false, note: '', status: 'confirmed', source: v.fKind === 'comp' ? 'comp' : 'manual', payment: v.fKind === 'comp' ? 'comp' : 'paidOffline', oversold: over, sourceNote: v.fKind === 'comp' ? 'comp (' + me().name.split(' ')[0] + ')' : 'added by ' + me().name.split(' ')[0] });

    case 'refund': p.payment = v.fAmt === 'full' ? 'refunded' : 'partiallyRefunded'; if (v.fFree) return runAction('cancel', id, v).replace('Booking cancelled', 'Refund recorded, booking cancelled'); return 'Refund recorded. Seats stay booked.';
    case 'gift': { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (let i = 0; i < 10; i++) c += A[Math.floor(Math.random() * A.length)]; S.gifts.unshift({ code: c, tickets: +v.fTix, to: v.fName.trim(), state: 'issued' }); return `Gift certificate ${c} issued.`; }

    case 'openLink': ui.trusted.push(ui.person); toast('Signed in by email on this iPad. Now your PIN.'); render(); break;
    case 'key': if (ui.pinEntry.length < 4) { ui.pinEntry += t.dataset.k; if (ui.pinEntry.length === 4) checkPin(); else render(); } break;
    case 'del': ui.pinEntry = ui.pinEntry.slice(0, -1); render(); break;
    case 'lock': ui.screen = 'signin'; ui.person = null; ui.pinEntry = ''; ui.view = 'home'; closeModal(); render(); break;
    case 'home': ui.view = 'home'; render(); break;
    case 'prevDate': ui.dinner = (ui.dinner + S.dinners.length - 1) % S.dinners.length; ui.sel = null; ui.seatSel = null; render(); break;
    case 'nextDate': ui.dinner = (ui.dinner + 1) % S.dinners.length; ui.sel = null; ui.seatSel = null; render(); break;
    case 'goDinner': ui.dinner = +t.dataset.i; ui.otab = 'bookings'; render(); break;
    case 'arr+': case 'arr-': { const p = d().parties.find(x => x.id === ui.sel); p.arrived = Math.max(0, Math.min(p.guests.length, p.arrived + (act === 'arr+' ? 1 : -1))); save(); render(); break; }
    case 'checkin': { const p = d().parties.find(x => x.id === ui.sel); p.checkedIn = true; p.arrived = p.arrived || p.guests.length; save(); toast(`${p.name} checked in`); const next = d().parties.find(x => x.status === 'confirmed' && !x.checkedIn); ui.sel = next ? next.id : null; render(); break; }
    case 'undoCheckin': { const p = d().parties.find(x => x.id === ui.sel); p.checkedIn = false; p.arrived = 0; save(); render(); break; }
    case 'toSeating': ui.seatSel = seatsOf(d(), ui.sel).length ? null : ui.sel; ui.view = 'seating'; render(); break;
    case 'quickNote': { const p = d().parties.find(x => x.id === ui.sel);
      modal(`<h2>Note · ${esc(p.name)}</h2><label class="f">Shows on the party for everyone tonight<input class="t" id="fNote" value="${esc(p.note)}" placeholder="e.g. waiting on their +1"></label><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" type="button" data-act="closeModal">Cancel</button><button class="btn solid" type="button" id="noteGo">Save note</button></div>`);
      document.getElementById('noteGo').onclick = () => { p.note = document.getElementById('fNote').value.slice(0, 200); save(); closeModal(); render(); };
      break; }
    case 'suggest': suggest(); render(); break;
    case 'clearSeats': S.seating[d().id] = {}; save(); render(); toast('All seats cleared'); break;
    case 'fire': S.service[d().id] = (S.service[d().id] || 0) + 1; save(); render(); toast(`Course ${S.service[d().id]} fired`); break;
    case 'unfire': S.service[d().id] = Math.max(0, (S.service[d().id] || 0) - 1); save(); render(); break;
    case 'ask': askForm(t.dataset.type, t.dataset.id); break;
    case 'closeModal': if (e.target === t || t.tagName === 'BUTTON') closeModal(); break;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.cap) { const c = (S.caps[D().id] = S.caps[D().id] || {}); c[t.dataset.cap] = t.checked; if (!t.checked) { const m = S.seating[D().id] || {}; const seat = t.dataset.cap + TABLES.find(x => x.id === t.dataset.cap).cap; delete m[seat]; } save(); render(); }
  if (t.dataset.chk) { S[t.dataset.chk][D().id][+t.dataset.i][1] = t.checked; save(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'ciFilter') { ui.ciFilter = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById('ciFilter'); el.focus(); el.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
function checkPin() {
  const p = me();
  if (ui.pinEntry === p.pin) { ui.tries[p.id] = 0; ui.screen = 'app'; ui.view = 'home'; ui.pinEntry = ''; render(); toast(`Welcome, ${p.name.split(' ')[0]}`); return; }
  ui.tries[p.id] = (ui.tries[p.id] || 0) + 1; ui.pinEntry = '';
  if (ui.tries[p.id] >= 5) { ui.trusted = ui.trusted.filter(x => x !== p.id); ui.tries[p.id] = 0; toast('5 wrong tries: this iPad needs a new email link.'); }
  render();
}
// ---------------- bug reports (shared with Claude; the only thing on this page that leaves the browser) ----------------
let bugDb = null, bugUser = null;
(async () => { try { if (!window.claude || !window.claude.use) return; bugDb = await claude.use('db'); bugUser = await claude.use('user');  } catch (e) {} })();
document.getElementById('bugBtn').onclick = () => {
  const where = ui.screen === 'signin' ? 'Sign in' : (ui.view === 'office' ? 'Office · ' + ui.otab : ui.view);
  modal(`<h2>Report a bug</h2><p class="muted">Goes to Sam with the screen you are on (${esc(where)}). Sample data only, so write freely.</p>
    <label class="f">What happened, or what felt wrong<textarea class="t" id="bText" rows="4" maxlength="2000" placeholder="e.g. Tapped Check in and the next party jumped to the top"></textarea></label>
    <label class="f" style="margin-top:10px">How bad<select class="t" id="bKind"><option value="broken">Broken: does the wrong thing</option><option value="confusing">Confusing or slow during service</option><option value="idea">Idea or wish</option></select></label>
    <div id="formErr" style="color:var(--rust-d);min-height:20px;margin-top:8px"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" type="button" data-act="closeModal">Cancel</button><button class="btn solid" type="button" id="bGo">Send</button></div>`);
  document.getElementById('bGo').onclick = async () => {
    const text = document.getElementById('bText').value.trim(); if (!text) { document.getElementById('formErr').textContent = 'Say what happened.'; return; }
    const btn = document.getElementById('bGo'); btn.disabled = true; btn.textContent = 'Sending…';
    if (!bugDb) {   // outside Claude (the SHF Portal address): hand it to Mail, prefilled
      const body = `${text}\n\n---\nHow bad: ${document.getElementById('bKind').value}\nScreen: ${where}\nDinner: ${D().id}\nSigned in as: ${ui.person || '(nobody)'}\nScreen size: ${window.innerWidth}x${window.innerHeight}\nDevice: ${navigator.userAgent.slice(0, 160)}`;
      window.location.href = 'mailto:sam@sanfermoseattle.com?subject=' + encodeURIComponent('[SHF v2 bug] ' + text.slice(0, 60)) + '&body=' + encodeURIComponent(body);
      closeModal(); toast('Opening Mail. Hit send and it goes to Sam.'); return;
    }
    try {
      let vid = null; try { vid = bugUser ? await bugUser.id() : null; } catch (e) {}
      await bugDb.collection('bugs').add({ text: text.slice(0, 2000), kind: document.getElementById('bKind').value, screen: where, dinner: D().id, signedInAs: ui.person || '', viewerId: vid, width: window.innerWidth, height: window.innerHeight, ua: navigator.userAgent.slice(0, 200), at: new Date().toISOString(), status: 'new' });
      closeModal(); toast('Thanks, sent to Claude.');
    } catch (e) { btn.disabled = false; btn.textContent = 'Send'; document.getElementById('formErr').textContent = (e && e.code === 'not_granted') ? 'Your access to this page is view-only, so it cannot send. Tell Sam.' : 'Could not send. Try again.'; }
  };
};
document.getElementById('resetBtn').onclick = () => { S = sampleData(); save(); ui = { ...ui, screen: 'signin', person: null, pinEntry: '', view: 'home', dinner: 0, sel: null, seatSel: null, trusted: ['sam', 'tim', 'kelly', 'arlen'], tries: {} }; closeModal(); render(); toast('Demo reset to the sample data'); };
render();
</script>
